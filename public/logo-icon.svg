<svg viewBox="20 20 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 定义 Apple G2 超椭圆路径，供底板、内描边和裁切蒙版复用 -->
    <path id="squircle" d="M 62,20 
                           H 178 
                           C 202,20 220,38 220,62 
                           V 178 
                           C 220,202 202,220 178,220 
                           H 62 
                           C 38,220 20,202 20,178 
                           V 62 
                           C 20,38 38,20 62,20 Z" />
    <!-- 内部裁切蒙版：确保描边 100% 靠内，绝不向外溢出 -->
    <clipPath id="inner-stroke-clip">
      <use href="#squircle" />
    </clipPath>
  </defs>

  <!-- 1. 较白的超椭圆底板: 使用 surface-plus-2 (#fcfcfb 高亮暖白) -->
  <use href="#squircle" fill="#fcfcfb" />

  <!-- 2. 整体视觉重心居中补偿容器 (X=-5, Y=+4) -->
  <g transform="translate(-5, 4)">
    
    <!-- 平行宇宙分身层 2 (最远层): 使用 tertiary 文字色 (#858177) -->
    <g transform="translate(15, -12)" opacity="0.28">
      <path d="M 76 70 H 100 V 84 H 140 V 70 H 164 V 98 H 180 V 140 H 164 V 170 H 138 V 152 H 102 V 170 H 76 V 140 H 60 V 98 H 76 Z"
            fill="#858177" stroke="#858177" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- 平行宇宙分身层 1 (中距层): 使用 secondary 文字色 (#57544d) -->
    <g transform="translate(7.5, -6)" opacity="0.48">
      <path d="M 76 70 H 100 V 84 H 140 V 70 H 164 V 98 H 180 V 140 H 164 V 170 H 138 V 152 H 102 V 170 H 76 V 140 H 60 V 98 H 76 Z"
            fill="#57544d" stroke="#57544d" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- 3. Blip 本体: 使用主色 (#1c1b18 近黑) -->
    <g>
      <path d="M 76 70 H 100 V 84 H 140 V 70 H 164 V 98 H 180 V 140 H 164 V 170 H 138 V 152 H 102 V 170 H 76 V 140 H 60 V 98 H 76 Z"
            fill="#1c1b18" stroke="#1c1b18" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 内部充气折痕: 与亮白底板 (#fcfcfb) 保持一致 -->
      <path d="M 76 73 Q 86 68 95 73" fill="none" stroke="#fcfcfb" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 76 135 Q 84 141 92 137" fill="none" stroke="#fcfcfb" stroke-width="4" stroke-linecap="round"/>
      <path d="M 148 137 Q 156 141 164 135" fill="none" stroke="#fcfcfb" stroke-width="4" stroke-linecap="round"/>
      <path d="M 104 144 Q 120 155 136 144" fill="none" stroke="#fcfcfb" stroke-width="4.5" stroke-linecap="round"/>

      <!-- 4. 日常待机眼 (● 待机): 对称圆角矩形，使用纯白 (#ffffff) 提亮眼神 -->
      <g fill="#ffffff">
        <rect x="86" y="103" width="16" height="22" rx="6"/>
        <rect x="138" y="103" width="16" height="22" rx="6"/>
      </g>
    </g>

  </g>

  <!-- 5. 极细黑色靠内描边 (置于最顶层，防止被内部元素遮挡) -->
  <!-- 说明：由于被 clip-path 裁切掉外侧一半，stroke-width="4" 实际向内显示为极精致的 2px 细线 -->
  <use href="#squircle" 
       fill="none" 
       stroke="#1c1b18" 
       stroke-width="4" 
        stroke-opacity="0.5"
       clip-path="url(#inner-stroke-clip)" />
</svg>