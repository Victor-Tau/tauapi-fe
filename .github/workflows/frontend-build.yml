name: Build frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: taskset -c 0 npm ci --no-audit --no-fund
      - name: Build static site
        run: taskset -c 0 npm run build
      - name: Package deployment files
        run: |
          test -s dist/index.html
          tar -C dist -czf tauapi-fe.tar.gz .
          printf '%s\n' "$GITHUB_SHA" > commit.txt
          sha256sum tauapi-fe.tar.gz > checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauapi-fe-${{ github.sha }}
          path: |
            tauapi-fe.tar.gz
            checksums.txt
            commit.txt
          if-no-files-found: error
