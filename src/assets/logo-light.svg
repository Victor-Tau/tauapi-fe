<svg viewBox="20 20 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. 超椭圆底板: 使用 surface-minus-2 (#e9e8e4)，与页面背景(#f8f8f6)及侧边栏(#f3f3f0)形成自然微对比 -->
  <path d="M 62,20 
           H 178 
           C 202,20 220,38 220,62 
           V 178 
           C 220,202 202,220 178,220 
           H 62 
           C 38,220 20,202 20,178 
           V 62 
           C 20,38 38,20 62,20 Z" 
        fill="#e9e8e4"/>

  <!-- 2. 整体视觉重心居中补偿容器 -->
  <g transform="translate(-5, 4)">
    
    <!-- 平行宇宙分身层 2 (最远层): 使用 tertiary 文字色 (#858177) 配合透明度 -->
    <g transform="translate(15, -12)" opacity="0.32">
      <path d="M 76 70 H 100 V 84 H 140 V 70 H 164 V 98 H 180 V 140 H 164 V 170 H 138 V 152 H 102 V 170 H 76 V 140 H 60 V 98 H 76 Z"
            fill="#858177" stroke="#858177" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- 平行宇宙分身层 1 (中距层): 使用 secondary 文字色 (#57544d) 配合透明度 -->
    <g transform="translate(7.5, -6)" opacity="0.5">
      <path d="M 76 70 H 100 V 84 H 140 V 70 H 164 V 98 H 180 V 140 H 164 V 170 H 138 V 152 H 102 V 170 H 76 V 140 H 60 V 98 H 76 Z"
            fill="#57544d" stroke="#57544d" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- 3. Blip 本体: 使用主色/primary文字色 (#1c1b18 暖调近黑) -->
    <g>
      <path d="M 76 70 H 100 V 84 H 140 V 70 H 164 V 98 H 180 V 140 H 164 V 170 H 138 V 152 H 102 V 170 H 76 V 140 H 60 V 98 H 76 Z"
            fill="#1c1b18" stroke="#1c1b18" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 内部充气折痕高光: 与底板 (#e9e8e4) 严格保持一致，形成镂空质感 -->
      <path d="M 76 73 Q 86 68 95 73" fill="none" stroke="#e9e8e4" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 76 135 Q 84 141 92 137" fill="none" stroke="#e9e8e4" stroke-width="4" stroke-linecap="round"/>
      <path d="M 148 137 Q 156 141 164 135" fill="none" stroke="#e9e8e4" stroke-width="4" stroke-linecap="round"/>
      <path d="M 104 144 Q 120 155 136 144" fill="none" stroke="#e9e8e4" stroke-width="4.5" stroke-linecap="round"/>

      <!-- 4. AI 思考眼: 使用 surface-plus-2 (#fcfcfb) 暖白，比纯白更柔和耐看 -->
      <g fill="#fcfcfb">
        <rect x="84" y="111" width="20" height="8" rx="4"/>
        <rect x="137" y="103" width="18" height="18" rx="6"/>
      </g>
    </g>

  </g>
</svg>