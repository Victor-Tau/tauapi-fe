<svg viewBox="20 20 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. 超椭圆底板: 深色内层色 #222222 (对应 Demo 的 #252529) -->
  <path d="M 62,20 
           H 178 
           C 202,20 220,38 220,62 
           V 178 
           C 220,202 202,220 178,220 
           H 62 
           C 38,220 20,202 20,178 
           V 62 
           C 20,38 38,20 62,20 Z" 
        fill="#222222"/>

  <!-- 2. 终端版专属居中补偿 (-4, 3) -->
  <g transform="translate(-4, 3)">
    
    <!-- 单层平行宇宙残影 (10, -8): 使用你的 Starlight 金 #c9ad7f (若你仍偏爱 Demo 的暖橙可换为 #d08a2a 或 #D97757) -->
    <g transform="translate(10, -8)" opacity="0.38">
      <path d="M 76 70 H 100 V 84 H 140 V 70 H 164 V 98 H 180 V 140 H 164 V 170 H 138 V 152 H 102 V 170 H 76 V 140 H 60 V 98 H 76 Z"
            fill="#c9ad7f" stroke="#c9ad7f" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- 3. Blip 本体: 深色模式主色 #f2f2f2 -->
    <path d="M 76 70 H 100 V 84 H 140 V 70 H 164 V 98 H 180 V 140 H 164 V 170 H 138 V 152 H 102 V 170 H 76 V 140 H 60 V 98 H 76 Z"
          fill="#f2f2f2" stroke="#f2f2f2" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 极简版仅保留底部微笑折痕 (在小尺寸下更干净) -->
    <path d="M 104 144 Q 120 155 136 144" fill="none" stroke="#222222" stroke-width="5" stroke-linecap="round"/>

    <!-- 4. 眼神 (使用深色 #141414，对应 Demo 的 #161618) -->
    <!-- 当前为 AI 思考眼： -->
    <g fill="#141414">
      <rect x="84" y="111" width="20" height="8" rx="4"/>
      <rect x="137" y="103" width="18" height="18" rx="6"/>
    </g>
    <!-- 若想换回 Demo 里的对称待机眼，用下面两行替换上面两个 rect 即可：
    <rect x="86" y="103" width="16" height="22" rx="6" fill="#141414"/>
    <rect x="138" y="103" width="16" height="22" rx="6" fill="#141414"/>
    -->
  </g>
</svg>